<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reconocimiento de Zanahorias</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fff3e0;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #e65100;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button,
        .boton-archivo {
            background: #e65100;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
            display: inline-block;
        }

        button:hover,
        .boton-archivo:hover {
            background: #bf360c;
        }

        input[type="file"] {
            display: none;
        }

        #webcam-container {
            margin-top: 20px;
        }

        #imagen-container {
            margin-top: 20px;
        }

        #imagen-subida {
            max-width: 300px;
            max-height: 300px;
            border-radius: 15px;
        }

        #label-container {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #fff8e1;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>🥕 Reconocimiento de Zanahorias</h1>

    <p>
        Utiliza inteligencia artificial para reconocer
        zanahorias buenas o malas.
    </p>

    <button onclick="iniciarCamara()">
        📷 Usar cámara
    </button>

    <label for="archivo" class="boton-archivo">
        📁 Subir imagen
    </label>

    <input
        type="file"
        id="archivo"
        accept="image/*"
        onchange="analizarImagen(event)"
    >

    <div id="webcam-container"></div>

    <div id="imagen-container"></div>

    <div id="label-container"></div>

</div>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/2BNEvYWLj/";

    let model;
    let webcam;
    let maxPredictions;

    // Cargar modelo
    async function cargarModelo() {

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(
            modelURL,
            metadataURL
        );

        maxPredictions = model.getTotalClasses();
    }

    // =========================
    // 📷 CÁMARA
    // =========================

    async function iniciarCamara() {

        if (!model) {
            await cargarModelo();
        }

        document.getElementById("imagen-container").innerHTML = "";

        webcam = new tmImage.Webcam(
            300,
            300,
            true
        );

        await webcam.setup();

        await webcam.play();

        document
            .getElementById("webcam-container")
            .innerHTML = "";

        document
            .getElementById("webcam-container")
            .appendChild(webcam.canvas);

        window.requestAnimationFrame(
            predecirCamara
        );
    }

    async function predecirCamara() {

        if (!webcam) return;

        webcam.update();

        const prediction =
            await model.predict(
                webcam.canvas
            );

        mostrarResultado(prediction);

        window.requestAnimationFrame(
            predecirCamara
        );
    }

    // =========================
    // 📁 SUBIR IMAGEN
    // =========================

    async function analizarImagen(event) {

        if (!model) {
            await cargarModelo();
        }

        const archivo = event.target.files[0];

        if (!archivo) return;

        // Detener cámara si estaba activa
        if (webcam) {
            webcam.stop();
            webcam = null;
        }

        document.getElementById(
            "webcam-container"
        ).innerHTML = "";

        const imagen =
            document.createElement("img");

        imagen.id = "imagen-subida";

        imagen.src =
            URL.createObjectURL(archivo);

        document.getElementById(
            "imagen-container"
        ).innerHTML = "";

        document.getElementById(
            "imagen-container"
        ).appendChild(imagen);

        // Esperar a que cargue la imagen
        imagen.onload = async function () {

            const prediction =
                await model.predict(imagen);

            mostrarResultado(prediction);
        };
    }

    // =========================
    // 🤖 MOSTRAR RESULTADO
    // =========================

    function mostrarResultado(prediction) {

        let mejorClase = "";
        let mayorProbabilidad = 0;

        for (let i = 0; i < prediction.length; i++) {

            if (
                prediction[i].probability >
                mayorProbabilidad
            ) {

                mayorProbabilidad =
                    prediction[i].probability;

                mejorClase =
                    prediction[i].className;
            }
        }

        const porcentaje =
            (mayorProbabilidad * 100)
            .toFixed(1);

        document.getElementById(
            "label-container"
        ).innerHTML = `
            <div class="resultado">
                🥕 Resultado:<br><br>
                <strong>${mejorClase}</strong>
                <br><br>
                Confianza: ${porcentaje}%
            </div>
        `;
    }

</script>

</body>
</html>
