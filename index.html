<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrot IA</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff8f0, #ffe0b2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .contenedor {
            width: 90%;
            max-width: 650px;
            background: white;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .icono {
            font-size: 55px;
        }

        h1 {
            margin: 10px 0;
            color: #e65100;
            font-size: 32px;
        }

        .descripcion {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* CAJA PARA SUBIR */

        .zona-subida {
            border: 3px dashed #ff9800;
            border-radius: 20px;
            padding: 40px 20px;
            background: #fff8f0;
            cursor: pointer;
            display: block;
            transition: 0.3s;
        }

        .zona-subida:hover {
            background: #fff0df;
        }

        .icono-subir {
            font-size: 50px;
        }

        .texto-subir {
            font-size: 20px;
            font-weight: bold;
            color: #e65100;
            margin-top: 10px;
        }

        .texto-secundario {
            color: #888;
            margin-top: 8px;
        }

        input[type="file"] {
            display: none;
        }

        /* PREVISUALIZACIÓN */

        #preview {
            margin-top: 20px;
        }

        #preview img {
            width: 300px;
            max-width: 100%;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        /* ESTADO */

        #estado {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        /* RESULTADO */

        #resultado {
            margin-top: 25px;
            padding: 22px;
            border-radius: 18px;
            background: #fff3e0;
            display: none;
        }

        .titulo-resultado {
            font-size: 17px;
            color: #777;
        }

        .clase {
            font-size: 28px;
            font-weight: bold;
            color: #e65100;
            margin: 12px 0;
        }

        .confianza {
            font-size: 16px;
            color: #555;
        }

        .barra {
            width: 100%;
            height: 12px;
            background: #eeeeee;
            border-radius: 10px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progreso {
            height: 100%;
            background: #ff9800;
            width: 0%;
            transition: width 0.5s;
        }

        /* BOTÓN */

        .boton {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 12px;
            background: #e65100;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }

        .boton:hover {
            background: #bf360c;
        }

        .pie {
            margin-top: 30px;
            color: #aaa;
            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="contenedor">

    <div class="icono">🥕</div>

    <h1>Carrot IA</h1>

    <p class="descripcion">
        Sistema inteligente para reconocer
        zanahorias buenas y malas mediante
        inteligencia artificial.
    </p>


    <!-- CAJA DE SUBIDA -->

    <label
        id="zonaSubida"
        for="archivo"
        class="zona-subida">

        <div class="icono-subir">
            📁
        </div>

        <div class="texto-subir">
            Sube una imagen
        </div>

        <div class="texto-secundario">
            Haz clic aquí para seleccionar una foto
        </div>

    </label>


    <input
        type="file"
        id="archivo"
        accept="image/*"
    >


    <!-- ESTADO -->

    <div id="estado">
        🤖 Cargando inteligencia artificial...
    </div>


    <!-- IMAGEN -->

    <div id="preview"></div>


    <!-- RESULTADO -->

    <div id="resultado">

        <div class="titulo-resultado">
            Resultado del análisis
        </div>

        <div
            id="clase"
            class="clase">
        </div>

        <div
            id="confianza"
            class="confianza">
        </div>

        <div class="barra">

            <div
                id="progreso"
                class="progreso">
            </div>

        </div>

    </div>


    <!-- NUEVA IMAGEN -->

    <button
        id="nuevo"
        class="boton"
        onclick="nuevaImagen()">

        🔄 Analizar otra imagen

    </button>


    <div class="pie">
        Desarrollado con Inteligencia Artificial
        y Teachable Machine 🤖
    </div>

</div>


<script>

    // ====================================
    // URL DEL MODELO
    // ====================================

    const URL =
        "https://teachablemachine.withgoogle.com/models/2BNEvYWLj/";


    let modelo;


    // ====================================
    // CARGAR MODELO
    // ====================================

    async function cargarModelo() {

        try {

            modelo = await tmImage.load(
                URL + "model.json",
                URL + "metadata.json"
            );


            document.getElementById("estado")
                .innerHTML =
                "✅ IA lista para analizar";


        }

        catch(error) {

            console.error(error);

            document.getElementById("estado")
                .innerHTML =
                "❌ No se pudo cargar la IA";

        }

    }


    cargarModelo();


    // ====================================
    // SELECCIONAR IMAGEN
    // ====================================

    document
        .getElementById("archivo")
        .addEventListener(
            "change",
            seleccionarImagen
        );


    function seleccionarImagen(event) {

        const archivo =
            event.target.files[0];


        if (!archivo) {
            return;
        }


        if (!modelo) {

            alert(
                "Espera unos segundos mientras se carga la IA."
            );

            return;

        }


        // 🔴 OCULTAR CAJA DE SUBIDA

        document.getElementById("zonaSubida")
            .style.display = "none";


        const lector =
            new FileReader();


        lector.onload = function(e) {


            const imagen =
                document.createElement("img");


            imagen.src =
                e.target.result;


            document.getElementById("preview")
                .innerHTML = "";


            document.getElementById("preview")
                .appendChild(imagen);


            imagen.onload = function() {

                analizarImagen(imagen);

            };

        };


        lector.readAsDataURL(archivo);

    }


    // ====================================
    // ANALIZAR
    // ====================================

    async function analizarImagen(imagen) {

        document.getElementById("estado")
            .innerHTML =
            "🤖 Analizando imagen...";


        try {

            const predicciones =
                await modelo.predict(imagen);


            let mejorClase = "";

            let mayorProbabilidad = 0;


            for (
                let i = 0;
                i < predicciones.length;
                i++
            ) {

                if (
                    predicciones[i].probability >
                    mayorProbabilidad
                ) {

                    mayorProbabilidad =
                        predicciones[i].probability;

                    mejorClase =
                        predicciones[i].className;

                }

            }


            const porcentaje =
                mayorProbabilidad * 100;


            // Mostrar resultado

            document.getElementById("resultado")
                .style.display = "block";


            document.getElementById("clase")
                .innerHTML =
                "🥕 " + mejorClase;


            document.getElementById("confianza")
                .innerHTML =
                "Nivel de confianza: " +
                porcentaje.toFixed(1) +
                "%";


            document.getElementById("progreso")
                .style.width =
                porcentaje + "%";


            document.getElementById("estado")
                .innerHTML =
                "✅ Análisis completado";


            // Mostrar botón

            document.getElementById("nuevo")
                .style.display = "inline-block";

        }

        catch(error) {

            console.error(error);

            document.getElementById("estado")
                .innerHTML =
                "❌ Error al analizar la imagen.";

        }

    }


    // ====================================
    // ANALIZAR OTRA IMAGEN
    // ====================================

    function nuevaImagen() {

        document.getElementById("archivo")
            .value = "";


        document.getElementById("zonaSubida")
            .style.display = "block";


        document.getElementById("preview")
            .innerHTML = "";


        document.getElementById("resultado")
            .style.display = "none";


        document.getElementById("nuevo")
            .style.display = "none";


        document.getElementById("estado")
            .innerHTML =
            "✅ IA lista para analizar";


    }

</script>

</body>

</html>
